<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบพัสดุสื่อสาร ศูนย์วิทยุกู้ภัย</title>
  <!-- Tailwind CSS สำหรับดีไซน์มือถือ -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Font: Prompt -->
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Prompt', sans-serif; background-color: #f3f4f6; }
  </style>
</head>
<body class="max-w-md mx-auto bg-gray-50 min-h-screen flex flex-col shadow-xl">

  <!-- Header -->
  <header class="bg-red-600 text-white p-4 sticky top-0 z-50 shadow-md flex justify-between items-center">
    <div>
      <h1 class="text-lg font-bold">🚨 พัสดุสื่อสารกู้ภัย</h1>
      <p class="text-xs text-red-100">ศูนย์วิทยุสื่อสาร มูลนิธิ</p>
    </div>
    <button onclick="loadData()" class="bg-red-700 hover:bg-red-800 text-xs px-3 py-2 rounded-lg font-medium transition">
      🔄 รีเฟรช
    </button>
  </header>

  <!-- Search & Filter Bar -->
  <div class="p-4 bg-white border-b sticky top-16 z-40 space-y-2">
    <input type="text" id="searchInput" oninput="filterItems()" placeholder="🔍 ค้นหาชื่อ, รุ่น, หรือ Serial / IMEI..." 
      class="w-full px-3 py-2 border rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-red-500">
    <div class="flex gap-2 overflow-x-auto pb-1 text-xs">
      <button onclick="filterStatus('all')" id="btn-all" class="px-3 py-1 bg-red-600 text-white rounded-full whitespace-nowrap font-medium">ทั้งหมด</button>
      <button onclick="filterStatus('พร้อมใช้งาน')" id="btn-ready" class="px-3 py-1 bg-gray-100 text-gray-700 rounded-full whitespace-nowrap font-medium">🟢 พร้อมใช้งาน</button>
      <button onclick="filterStatus('เบิกใช้งาน')" id="btn-borrowed" class="px-3 py-1 bg-gray-100 text-gray-700 rounded-full whitespace-nowrap font-medium">🟡 เบิกใช้งาน</button>
      <button onclick="filterStatus('ส่งซ่อม')" id="btn-repair" class="px-3 py-1 bg-gray-100 text-gray-700 rounded-full whitespace-nowrap font-medium">🔴 ส่งซ่อม</button>
    </div>
  </div>

  <!-- Content List Container -->
  <main id="itemList" class="flex-1 p-4 space-y-3 overflow-y-auto pb-20">
    <!-- Loading State -->
    <div class="text-center py-10 text-gray-400 text-sm">กำลังโหลดข้อมูลพัสดุ...</div>
  </main>

  <!-- Bottom Navigation / Action Bar -->
  <nav class="bg-white border-t p-3 sticky bottom-0 flex justify-around text-center text-xs text-gray-600 shadow-lg">
    <button onclick="switchTab('items')" class="flex flex-col items-center text-red-600 font-medium">
      <span class="text-xl">📦</span>คลังพัสดุ
    </button>
    <button onclick="switchTab('borrow')" class="flex flex-col items-center hover:text-red-600">
      <span class="text-xl">📝</span>เบิก-คืน
    </button>
  </nav>

  <!-- JavaScript สำหรับเชื่อมต่อ Apps Script API -->
  <script>
    // ** ⚠️ สำคัญ: นำ Web App URL ที่ได้จากการ Deploy Google Apps Script มาใส่ตรงนี้ **
    const WEB_APP_URL = "PUT_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE";

    let allItems = [];
    let currentStatusFilter = 'all';

    // โหลดข้อมูลเมื่อเปิดเว็บ
    window.onload = function() {
      loadData();
    };

    async function loadData() {
      const listEl = document.getElementById('itemList');
      listEl.innerHTML = `<div class="text-center py-10 text-gray-400 text-sm">กำลังซิงค์ข้อมูลจากศูนย์วิทยุ...</div>`;
      
      if(WEB_APP_URL.includes("PUT_YOUR")) {
        listEl.innerHTML = `<div class="p-4 bg-yellow-50 text-yellow-800 rounded-xl text-xs text-center">
          ⚠️ กรุณานำ Web App URL ของ Apps Script มาใส่ในตัวแปร <code>WEB_APP_URL</code> ในโค้ดก่อนใช้งานครับ
        </div>`;
        return;
      }

      try {
        let res = await fetch(WEB_APP_URL);
        let data = await res.json();
        if(data.status === "success") {
          allItems = data.items || [];
          renderItems(allItems);
        } else {
          listEl.innerHTML = `<div class="text-center text-red-500 py-10 text-xs">เกิดข้อผิดพลาด: ${data.message}</div>`;
        }
      } catch (err) {
        listEl.innerHTML = `<div class="text-center text-red-500 py-10 text-xs">ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้: ${err.message}</div>`;
      }
    }

    function renderItems(items) {
      const listEl = document.getElementById('itemList');
      if(items.length === 0) {
        listEl.innerHTML = `<div class="text-center py-10 text-gray-400 text-xs">ไม่พบรายการพัสดุ</div>`;
        return;
      }

      listEl.innerHTML = items.map(item => {
        let statusColor = 'bg-green-100 text-green-800';
        if(item.status === 'เบิกใช้งาน') statusColor = 'bg-yellow-100 text-yellow-800';
        if(item.status === 'ส่งซ่อม') statusColor = 'bg-red-100 text-red-800';

        return `
          <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex flex-col justify-between">
            <div class="flex justify-between items-start mb-2">
              <div>
                <span class="text-xs font-semibold text-gray-400">${item.id || '-'}</span>
                <h3 class="font-bold text-gray-800 text-sm">${item.name || 'ไม่มีชื่ออุปกรณ์'}</h3>
              </div>
              <span class="text-[10px] px-2 py-0.5 rounded-full font-medium ${statusColor}">${item.status || 'พร้อมใช้งาน'}</span>
            </div>
            <div class="text-xs text-gray-500 space-y-1 mb-3">
              <div><b>ยี่ห้อ/รุ่น:</b> ${item.brand || '-'} / ${item.model || '-'}</div>
              <div><b>Serial/IMEI:</b> <span class="font-mono text-gray-700">${item.serial || '-'}</span></div>
              <div><b>ที่เก็บ:</b> ${item.location || '-'}</div>
            </div>
            <div class="flex gap-2 pt-2 border-t border-gray-50">
              <button onclick="openBorrowModal('${item.id}', '${item.name}')" class="flex-1 bg-red-50 text-red-600 hover:bg-red-100 py-1.5 rounded-lg text-xs font-medium transition text-center">
                📝 ทำรายการเบิก
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    function filterItems() {
      let keyword = document.getElementById('searchInput').value.toLowerCase();
      let filtered = allItems.filter(item => {
        let matchSearch = (item.name && item.name.toLowerCase().includes(keyword)) ||
                          (item.serial && item.serial.toLowerCase().includes(keyword)) ||
                          (item.id && item.id.toLowerCase().includes(keyword));
        let matchStatus = currentStatusFilter === 'all' || item.status === currentStatusFilter;
        return matchSearch && matchStatus;
      });
      renderItems(filtered);
    }

    function filterStatus(status) {
      currentStatusFilter = status;
      // เปลี่ยนสีปุ่ม Filter
      ['all', 'ready', 'borrowed', 'repair'].forEach(s => {
        let btn = document.getElementById(`btn-${s}`);
        btn.className = "px-3 py-1 bg-gray-100 text-gray-700 rounded-full whitespace-nowrap font-medium";
      });
      let activeBtnMap = { 'all': 'all', 'พร้อมใช้งาน': 'ready', 'เบิกใช้งาน': 'borrowed', 'ส่งซ่อม': 'repair' };
      document.getElementById(`btn-${activeBtnMap[status]}`).className = "px-3 py-1 bg-red-600 text-white rounded-full whitespace-nowrap font-medium";
      
      filterItems();
    }

    function openBorrowModal(id, name) {
      alert(`เลือกอุปกรณ์: [${id}] ${name}\n(สามารถพัฒนากล่องบันทึกผู้เบิกและส่งข้อมูลผ่าน doPost ต่อไปได้ครับ)`);
    }

    function switchTab(tab) {
      if(tab === 'borrow') {
        alert("ฟังก์ชันบันทึกการเบิก-คืนด่วน กำลังพัฒนาเพิ่มเติมครับ");
      }
    }
  </script>
</body>
</html>
